<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CHINACNU Steel - 彩涂卷 / 压瓦计算器</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --primary-color: #1663b2;
      --accent-color: #4a90e2;
      --dark-color: #1a3e72;
      --light-color: #edf4fd;
      --white: #ffffff;
      --gray: #f5f7fa;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--gray);
      color: #1e293b;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      background: var(--white);
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      max-width: 560px;
      width: 100%;
      padding: 2rem;
      box-shadow: 0 8px 30px rgba(0, 77, 155, 0.1);
      position: relative;
    }

    .logo-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      margin-right: 12px;
    }

    .brand-name {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary-color);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .language-toggle {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      font-weight: 600;
      color: var(--primary-color);
      cursor: pointer;
    }

    h2 {
      text-align: center;
      color: var(--dark-color);
      margin-bottom: 10px;
    }

    p.sub {
      text-align: center;
      font-size: 0.95rem;
      color: #64748b;
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    input, select {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 1rem;
      transition: 0.2s;
    }

    input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 6px rgba(74, 144, 226, 0.3);
      outline: none;
    }

    .form-group.hidden {
      display: none;
    }

    button.calculate-btn {
      width: 100%;
      padding: 0.75rem;
      margin-top: 1rem;
      background: linear-gradient(to right, var(--primary-color), var(--accent-color));
      color: white;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.3s;
    }

    button.calculate-btn:hover {
      opacity: 0.95;
    }

    .result-section {
      margin-top: 1.5rem;
      padding: 1.25rem;
      background: var(--light-color);
      border: 1px solid #dceeff;
      border-radius: 10px;
    }

    .result-section p {
      margin: 6px 0;
      color: var(--dark-color);
      font-weight: 500;
    }

    .l10n {
      display: none;
    }

    .l10n.active {
      display: block;
    }

    @media (max-width: 480px) {
      .brand-name {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <button class="language-toggle" onclick="toggleLanguage()">EN / 中文</button>

    <div class="logo-brand">
      <svg class="logo-icon" viewBox="0 0 48 48">
        <circle cx="24" cy="24" r="20" fill="#1663b2"/>
        <text x="24" y="32" text-anchor="middle" font-size="18" fill="#fff" font-weight="700" font-family="Inter, sans-serif">CNU</text>
      </svg>
      <div class="brand-name">CHINACNU STEEL</div>
    </div>

    <div class="l10n active" data-lang="zh">
      <h2>彩涂卷 / 压瓦计算器</h2>
      <p class="sub">自动计算重量、米数、面积、张数</p>
    </div>
    <div class="l10n" data-lang="en">
      <h2>Coated Coil / Roofing Calculator</h2>
      <p class="sub">Smart calculator for weight, length & sheets</p>
    </div>

    <form id="Calculator">
      <div class="form-group">
        <label class="l10n active" data-lang="zh">厚度 (mm)</label>
        <label class="l10n" data-lang="en">Thickness (mm)</label>
        <input type="number" id="thickness" value="0.5" min="0.1" step="0.01" required />
      </div>

      <div class="form-group">
        <label class="l10n active" data-lang="zh">宽度 (mm)</label>
        <label class="l10n" data-lang="en">Width (mm)</label>
        <input type="number" id="width" value="1000" min="0.1" step="0.01" required />
      </div>

      <div class="form-group">
        <label class="l10n active" data-lang="zh">请选择计算类型</label>
        <label class="l10n" data-lang="en">Select Calculation Type</label>
        <select id="isRoofed" onchange="toggleRoofInput()">
          <option value="no"> steel coils </option>
          <option value="yes"> Roofing Sheets </option>
        </select>
      </div>

      <div class="form-group hidden" id="roofWidthGroup">
        <label class="l10n active" data-lang="zh">压瓦展开宽度 (mm)</label>
        <label class="l10n" data-lang="en">Roofing Unfold Width (mm)</label>
        <input type="number" id="roofWidth" value="828" min="100" step="1" />
      </div>

      <div class="form-group hidden" id="roofLengthGroup">
        <label class="l10n active" data-lang="zh">单张瓦长度 (米)</label>
        <label class="l10n" data-lang="en">Roof Panel Length (m)</label>
        <input type="number" id="roofLength" value="2.5" min="0.1" step="0.01" />
      </div>

      <button type="submit" class="calculate-btn">计算 / Calculate</button>
      <div class="result-section" id="result"></div>
    </form>
  </div>

  <script>
    const LANGUAGES = { current: 'zh' };

    function toggleLanguage() {
      LANGUAGES.current = LANGUAGES.current === 'zh' ? 'en' : 'zh';
      document.querySelectorAll('.l10n').forEach(el => {
        el.classList.toggle('active', el.getAttribute('data-lang') === LANGUAGES.current);
      });
      document.getElementById('result').innerHTML = '';
    }

    function toggleRoofInput() {
      const isRoofed = document.getElementById("isRoofed").value === "yes";
      document.getElementById("roofWidthGroup").classList.toggle("hidden", !isRoofed);
      document.getElementById("roofLengthGroup").classList.toggle("hidden", !isRoofed);
    }

    function calculate() {
      const t = parseFloat(document.getElementById('thickness').value) / 1000;
      const w = parseFloat(document.getElementById('width').value) / 1000;
      const isRoofed = document.getElementById("isRoofed").value === "yes";
      const rw = isRoofed ? parseFloat(document.getElementById("roofWidth").value) / 1000 : null;
      const rl = isRoofed ? parseFloat(document.getElementById("roofLength").value) : null;

      const density = 7850;

      if (!t || !w || (isRoofed && (!rw || !rl))) {
        document.getElementById('result').innerHTML = LANGUAGES.current === 'zh' ? '请输入完整数据。' : 'Please enter valid data.';
        return;
      }

      const baseMeters = 1000 / (t * w * density);
      const baseWeight = t * w * density;
      const baseArea = baseMeters * w;

      let result = `
        <p><strong>${LANGUAGES.current === 'zh' ? '每米重量' : 'Weight per meter'}:</strong> ${baseWeight.toFixed(2)} kg/m</p>
        <p><strong>${LANGUAGES.current === 'zh' ? '每吨米数' : 'Meters per ton'}:</strong> ${baseMeters.toFixed(2)} m</p>
        <p><strong>${LANGUAGES.current === 'zh' ? '每吨面积' : 'Area per ton'}:</strong> ${baseArea.toFixed(2)} m²</p>
      `;

      if (isRoofed && rw && rl) {
        const roofMeters = 1000 / (t * rw * density);
        const roofWeight = t * rw * density;
        const roofArea = roofMeters * rw;
        const sheetsPerTon = Math.floor(roofMeters / rl);
        const sheetWeight = rl * rw * t * density;

        result += `
          <br><strong style="color: #1663b2;">${LANGUAGES.current === 'zh' ? '压瓦后结果' : 'After Roofing'}</strong><br>
          <p><strong>${LANGUAGES.current === 'zh' ? '每米重量' : 'Weight per meter'}:</strong> ${roofWeight.toFixed(2)} kg/m</p>
          <p><strong>${LANGUAGES.current === 'zh' ? '每吨米数' : 'Meters per ton'}:</strong> ${roofMeters.toFixed(2)} m</p>
          <p><strong>${LANGUAGES.current === 'zh' ? '每吨面积' : 'Area per ton'}:</strong> ${roofArea.toFixed(2)} m²</p>
          <p><strong>${LANGUAGES.current === 'zh' ? '每吨张数' : 'Sheets per ton'}:</strong> ${sheetsPerTon} 张</p>
          <p><strong>${LANGUAGES.current === 'zh' ? '每张重量' : 'Weight per sheet'}:</strong> ${sheetWeight.toFixed(2)} kg</p>
        `;
      }

      result += `
        <div style="text-align:center; margin-top:1rem;">
          <a href="https://wa.me/8619154316688" target="_blank"
            style="background-color:#25D366; color:white; padding:10px 16px; border-radius:6px; text-decoration:none; font-weight:600;">
            💬 ${LANGUAGES.current === 'zh' ? '联系我们 (WhatsApp)' : 'Contact us on WhatsApp'}
          </a>
        </div>
      `;

      document.getElementById("result").innerHTML = result;
    }

    document.getElementById("Calculator").addEventListener("submit", function(e) {
      e.preventDefault();
      calculate();
    });

    window.onload = () => {
      calculate();
      toggleRoofInput();
    };
  </script>
</body>
</html>
