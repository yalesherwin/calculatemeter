<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CHINACNU Steel - 彩涂卷计算器</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --primary-color: #1663b2;
      --accent-color: #4a90e2;
      --dark-color: #1a3e72;
      --light-color: #edf4fd;
      --white: #ffffff;
      --gray: #f5f7fa;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--gray);
      color: #1e293b;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      background: var(--white);
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      max-width: 520px;
      width: 100%;
      padding: 2rem;
      box-shadow: 0 8px 30px rgba(0, 77, 155, 0.1);
      position: relative;
    }

    .logo-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      margin-right: 12px;
    }

    .brand-name {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary-color);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .language-toggle {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      font-weight: 600;
      color: var(--primary-color);
      cursor: pointer;
    }

    h2 {
      text-align: center;
      color: var(--dark-color);
      margin-bottom: 10px;
    }

    p.sub {
      text-align: center;
      font-size: 0.95rem;
      color: #64748b;
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    input {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 1rem;
      transition: 0.2s;
    }

    input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 6px rgba(74, 144, 226, 0.3);
      outline: none;
    }

    button.calculate-btn {
      width: 100%;
      padding: 0.75rem;
      margin-top: 1rem;
      background: linear-gradient(to right, var(--primary-color), var(--accent-color));
      color: white;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.3s;
    }

    button.calculate-btn:hover {
      opacity: 0.95;
    }

    .result-section {
      margin-top: 1.5rem;
      padding: 1.25rem;
      background: var(--light-color);
      border: 1px solid #dceeff;
      border-radius: 10px;
    }

    .result-section p {
      margin: 6px 0;
      color: var(--dark-color);
      font-weight: 500;
    }

    .l10n {
      display: none;
    }

    .l10n.active {
      display: block;
    }

    @media (max-width: 480px) {
      .brand-name {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <button class="language-toggle" onclick="toggleLanguage()">EN / 中文</button>
    
    <div class="logo-brand">
      <svg class="logo-icon" viewBox="0 0 48 48">
        <circle cx="24" cy="24" r="20" fill="#1663b2"/>
        <text x="24" y="32" text-anchor="middle" font-size="18" fill="#fff" font-weight="700" font-family="Inter, sans-serif">CNU</text>
      </svg>
      <div class="brand-name">CHINACNU STEEL</div>
    </div>

    <div class="l10n active" data-lang="zh">
      <h2>彩涂钢卷计算器</h2>
      <p class="sub">重量、米数、面积智能计算</p>
    </div>
    <div class="l10n" data-lang="en">
      <h2>Coated Coil Calculator</h2>
      <p class="sub">Smart weight, length & area calculator</p>
    </div>

    <form id="Calculator">
      <div class="form-group">
        <label class="l10n active" data-lang="zh">厚度 (mm)</label>
        <label class="l10n" data-lang="en">Thickness (mm)</label>
        <input type="number" id="thickness" value="0.6" min="0.1" step="0.01" required />
      </div>

      <div class="form-group">
        <label class="l10n active" data-lang="zh">宽度 (mm)</label>
        <label class="l10n" data-lang="en">Width (mm)</label>
        <input type="number" id="width" value="600" min="0.1" step="0.01" required />
      </div>

      <button type="submit" class="calculate-btn">CALCULATE / 计算</button>
      <div class="result-section" id="result"></div>
    </form>
  </div>

  <script>
    const LANGUAGES = {
      current: 'zh'
    };

    function toggleLanguage() {
      LANGUAGES.current = LANGUAGES.current === 'zh' ? 'en' : 'zh';
      document.querySelectorAll('.l10n').forEach(el => {
        el.classList.toggle('active', el.getAttribute('data-lang') === LANGUAGES.current);
      });
      document.getElementById('result').innerHTML = '';
    }

    function calculate() {
      const thickness = parseFloat(document.getElementById('thickness').value) / 1000;
      const width = parseFloat(document.getElementById('width').value) / 1000;

      if (isNaN(thickness) || isNaN(width) || thickness === 0 || width === 0) {
        document.getElementById('result').innerHTML = '请输入有效的厚度和宽度。';
        return;
      }

      const metersPerTon = 1000 / (thickness * width * 7850);
      const weightPerMeter = thickness * width * 7850;
      const areaPerTon = metersPerTon * width;

      const zh = `
        <p><strong>每米重量：</strong> ${weightPerMeter.toFixed(2)} kg/m</p>
        <p><strong>每吨米数：</strong> ${metersPerTon.toFixed(2)} 米</p>
        <p><strong>每吨面积：</strong> ${areaPerTon.toFixed(2)} m²</p>
      `;

      const en = `
        <p><strong>Weight per meter:</strong> ${weightPerMeter.toFixed(2)} kg/m</p>
        <p><strong>Meters per ton:</strong> ${metersPerTon.toFixed(2)} m</p>
        <p><strong>Area per ton:</strong> ${areaPerTon.toFixed(2)} m²</p>
      `;

      document.getElementById('result').innerHTML = LANGUAGES.current === 'zh' ? zh : en;
    }

    document.getElementById('Calculator').addEventListener('submit', function(e) {
      e.preventDefault();
      calculate();
    });

    window.onload = calculate;
  </script>
</body>
</html>
